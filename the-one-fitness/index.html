<title>Domains for Sale | The One Fitness Club</title>
<style>
*{box-sizing:border-box}
:root{--navy:#101a38;--blue:#1764ed;--pale:#edf3ff;--line:#dce4f2;--muted:#647089}
body{margin:0;background:#f8faff;color:var(--navy);font-family:Inter,Segoe UI,Arial,sans-serif}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{width:min(1080px,100%);text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;padding:10px 20px;border-radius:999px;font-weight:750;font-size:clamp(13px,2vw,18px);box-shadow:0 3px 12px rgba(16,26,56,.04)}
.brand-icon{font-size:20px;color:var(--blue)}
h1{margin:24px 0 24px;font-size:clamp(38px,6vw,76px);line-height:1.03;letter-spacing:-2.6px;font-weight:900}
h1 .sale{color:var(--blue)}
.domains{display:flex;align-items:center;justify-content:center;gap:15px;margin:0 auto 28px}
.domain{display:flex;align-items:center;justify-content:center;gap:12px;padding:17px 22px;background:var(--pale);border:1px solid #e4edff;border-radius:20px;font-weight:800;font-size:clamp(14px,2vw,24px);overflow-wrap:anywhere;min-width:0}
.domain-icon{font-size:22px;color:#1646a5;flex-shrink:0}
.plus{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#f0f5ff;border:1px solid var(--line);font-size:27px;font-weight:800;color:#123c91;flex-shrink:0}
.pricing{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:850px;margin:0 auto 30px}
.price-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;justify-content:center;min-height:155px}
.price-card.bundle{border:2px solid var(--blue);background:linear-gradient(145deg,#f3f7ff,#e7f0ff);position:relative;box-shadow:0 8px 22px rgba(23,100,237,.10)}
.price-card.bundle:before{content:"BEST OFFER";position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--blue);color:white;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:850;letter-spacing:.6px;white-space:nowrap}
.label{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px}
.domain-label{font-size:clamp(15px,2.1vw,21px);font-weight:800;overflow-wrap:anywhere}
.amount{font-size:clamp(36px,5vw,54px);font-weight:900;letter-spacing:-1.5px;color:var(--blue);margin-top:8px;line-height:1}
.bundle .label{color:#2c4370}
.bundle .domain-label{font-size:clamp(16px,2.2vw,22px)}
.contact-heading{display:flex;align-items:center;gap:15px;justify-content:center;font-size:clamp(18px,2.5vw,25px);font-weight:800;margin:0 0 18px}
.contact-heading:before,.contact-heading:after{content:"";height:1px;background:var(--line);flex:1;max-width:200px}
.contacts{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.contact{display:flex;align-items:center;gap:13px;border-radius:16px;padding:14px 20px;text-decoration:none;min-width:min(340px,100%);justify-content:center;font-weight:750;transition:background .15s}
.whatsapp{background:#16a34a;color:white;box-shadow:0 5px 14px rgba(22,163,74,.14)}
.whatsapp:hover{background:#12843d}
.email{border:1.5px solid var(--blue);background:#fff;color:var(--navy)}
.email:hover{background:#f1f6ff}
.contact-icon{font-size:25px}
.contact-copy{text-align:left}
.contact-copy small{display:block;font-size:13px;opacity:.8;font-weight:650;margin-bottom:3px}
.contact-copy strong{font-size:16px;overflow-wrap:anywhere}
.location{margin:20px auto 0;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:white;padding:9px 16px;border-radius:999px;color:var(--muted);font-weight:650;font-size:14px}
@media(max-width:650px){.page{padding:20px 15px}.domains{flex-direction:column;gap:10px;margin-bottom:22px;width:100%}.domain{width:100%;padding:14px 12px;border-radius:15px;font-size:clamp(13px,4vw,17px)}.plus{width:37px;height:37px;font-size:22px}.pricing{gap:10px;margin-bottom:23px}.price-card{padding:20px 10px 14px;min-height:135px;border-radius:16px}.label{font-size:12px}.domain-label{font-size:14px}.amount{font-size:clamp(29px,8vw,40px)}.bundle:before{font-size:10px;padding:6px 12px}.contacts{gap:10px}.contact{min-width:100%;padding:13px 15px}.contact-copy strong{font-size:15px}h1{letter-spacing:-1.8px;margin:20px 0 22px}}
@media(max-height:760px) and (min-width:651px){.page{padding:15px}.brand{padding:8px 15px}h1{font-size:clamp(38px,5vw,60px);margin:17px 0}.domains{margin-bottom:20px}.price-card{min-height:135px;padding:15px}.pricing{margin-bottom:22px}.contact-heading{margin-bottom:12px}.contact{padding:11px 16px}.location{margin-top:13px}}
</style>
</head>

</div>

</html>
